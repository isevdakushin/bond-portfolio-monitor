# Настройки инструмента анализа портфеля.
# Все пороги — допущения аналитика. Каждое значение можно изменить здесь
# (действует для скрипта и как значение по умолчанию в интерфейсе) или в интерфейсе.

quality:
  # Допуск суммы весов к 100%, п.п. 0,05 п.п. покрывает округление весов
  # до десятых долей процента и не пропускает реальную ошибку в позиции.
  weight_sum_tolerance_pp: 0.05

  # Диапазоны «правдоподобных» значений. Всё, что вне диапазона, — предупреждение.
  # YTM 0–20%: выше 20% — уровень дистресса, для IG/BB-портфеля почти наверняка ошибка ввода.
  ytm_min: 0.0
  ytm_max: 0.20
  # G-spread от −50 до 1500 бп: отрицательный спред возможен лишь у квази-суверенов AAA,
  # выше 1500 бп — дистресс.
  gspread_min_bp: -50
  gspread_max_bp: 1500
  # Купон 0–20%.
  coupon_max: 0.20

  # Сверка mod. duration из файла с расчётной (по купону, YTM и дате погашения).
  # Отклонение считается существенным, если больше И 0,5 года, И 15% от значения.
  # Мягкий порог выбран потому, что в файле для бумаг с call-опционом
  # дюрация может быть рассчитана к дате колла, а не к погашению.
  duration_check_abs: 0.5
  duration_check_rel: 0.15
  # Mod. duration не может быть больше срока до погашения. Превышение до 0,25 года —
  # предупреждение (типично для округления до 0,1 или значения на старую дату),
  # больше — ошибка.
  duration_over_maturity_error: 0.25

  # Допуски при сверке итогов файла (дашборд, лист Allocation, Breakdown) с расчётом.
  reported_tolerance:
    ytm: 0.0001        # 1 бп
    duration: 0.01     # 0,01 года
    gspread_bp: 0.5    # 0,5 бп
    weight_pp: 0.1     # 0,1 п.п. — заявления в тексте дашборда округлены

  # Значения в колонке Country, которые не являются страной (регион/агрегат).
  # Такие позиции нельзя корректно учесть в концентрации по странам.
  non_country_values: [Global, Latam, LatAm, EM, Europe, Asia, Africa, Americas,
                       Multi, Multinational, Supranational, Other, World, MENA, CEE]

analysis:
  # Комиссия платформы, вычитается из средневзвешенной YTM (как на листе 00 Dashboard).
  fee: 0.005
  # Допуски «в пределах цели» для сравнения метрик с целевыми значениями дашборда.
  # 10 бп по YTM ≈ погрешность выбора конкретных бумаг; 0,25 года по дюрации ≈ одна позиция
  # длинного IG весом 3%; 10 бп по G-spread — того же порядка, что разброс спредов внутри рейтинга.
  target_tolerance:
    ytm: 0.0010
    duration: 0.25
    gspread_bp: 10
  # Отклонение доли sleeve от целевой аллокации, после которого выводится сигнал, п.п.
  # 2 п.п. — меньше одного транша добора (5% NAV) и больше веса одной короткой позиции (2%).
  allocation_gap_pp: 2.0

gspread:
  # Основной способ пересчёта: UST интерполируется на срок до погашения (рыночный стандарт).
  # Для сравнения всегда считается и по дюрации.
  method_primary: maturity
  # Системное расхождение: если медиана (расчёт − файл) по бумагам больше порога, это говорит о разных
  # кривых или датах у файла и у расчёта, а не о проблеме отдельных бумаг. 10 бп ≈ дневное движение UST.
  systematic_bp: 10
  # Выброс: бумага, у которой расхождение отличается от общего (медианного) больше порога.
  # 15 бп — больше типичного шума из-за интерполяции и конвенций доходности (5–10 бп).
  outlier_bp: 15
  # Диагностика: поиск даты кривой UST, которая лучше всего объясняет G-spread из файла,
  # в окне N дней до даты портфеля (дальше — риск случайного совпадения уровня кривой).
  implied_date_window_days: 120

signals:
  # Какой G-spread использовать для сигналов: file — из файла компании (по умолчанию),
  # recomputed — пересчитанный по кривой Treasury. Относительные сигналы от общего сдвига не зависят.
  spread_source: file
  # Пиры бумаги: та же рейтинговая группа (AA и выше / A / BBB / BB / B) и дюрация в пределах ± окна.
  # 2 года — «похожая» чувствительность к ставкам; если пиров меньше min_peers, окно расширяется
  # на 1 год, пока не наберётся группа или не будет взята вся рейтинговая группа.
  duration_window: 2.0
  min_peers: 3
  # Приводить спред пира к дюрации бумаги: s_peer + наклон × (MD бумаги − MD пира). Наклон (бп на год
  # дюрации) оценивается по портфелю внутри рейтинговых групп. Без поправки короткие бумаги выглядят
  # «узкими», а длинные — «широкими» просто из-за формы кривой спредов.
  duration_adjust: true
  # Сигнал «шире группы»: премия к медиане пиров больше И абсолютного, И относительного порога.
  # 30 бп ≈ разница между соседними ступенями рейтинга в IG; 25% отсекает шум у широких HY-спредов.
  wide_abs_bp: 30
  wide_rel: 0.25
  # Два портфеля: «аномальное расширение» — изменение спреда бумаги больше медианного изменения
  # её рейтинговой группы на порог. 20 бп — заметно больше дневного шума спредов IG.
  widening_abs_bp: 20

rules:
  # Правила добора. По умолчанию читаются из текста дашборда загруженного файла (prefer_file: true);
  # значения ниже — запасные, если в файле их нет. Источник: 00 Dashboard от 14.09.2026, строка
  # «Лестница добора длины…» и лист 02 Allocation «Путь к цели…».
  prefer_file: true
  ladder:                       # 10Y UST в зоне [lower; upper] -> +add NAV в Long IG (до target_after)
    - {lower: 0.0510, upper: 0.0515, add: 0.05, target_after: 0.20}
    - {lower: 0.0525, upper: 0.0540, add: 0.05, target_after: 0.25}
  ladder_sleeve_keyword: long   # sleeve, который доводится по лестнице (Long Term Corp Bonds IG)
  # Трактовка: уровень считается достигнутым, если 10Y UST ≥ нижней границы зоны
  # (выше зоны — бумаги ещё дешевле, правило тем более выполнено).
  hy_oas_trigger_bp: 325        # HY OAS ≥ порога -> IBHJ с hy_from до hy_to
  hy_instrument: IBHJ
  hy_from: 0.045
  hy_to: 0.08
  calendar: ["11-15", "01-15"]  # календарные пересмотры (ММ-ДД): «в середине ноября и января»
  calendar_add: 0.05            # «докупаем по +5%, если уровни не пришли»

compare:
  # Пороги подсветки изменений по бумаге между портфелями.
  # 1 п.п. веса — меньше минимального шага ребалансировки и больше округления; 25 бп YTM —
  # заметно больше месячного шума доходности IG-бумаги при неизменном рынке.
  weight_change_pp: 1.0
  ytm_change_bp: 25

estimate:
  # Оценка портфеля на последнюю рыночную дату: ΔYTM бумаги ≈ ΔUST на её срок + ΔOAS её индекса ICE (FRED).
  # Индекс выбирается по региону и рейтингу: EM — индексы EM Corporate Plus (IG или HY), остальные —
  # индексы US Corporate / US High Yield по буквенной ступени рейтинга; фонд HY — весь US High Yield.
  series:
    AAA: BAMLC0A1CAAA
    AA: BAMLC0A2CAA
    A: BAMLC0A3CA
    BBB: BAMLC0A4CBBB
    BB: BAMLH0A1HYBB
    B: BAMLH0A2HYB
    CCC: BAMLH0A3HYC
    EM_IG: BAMLEMIBHGCRPIOAS
    EM_HY: BAMLEMHBHYCRPIOAS
    HY_FUND: BAMLH0A0HYM2

stress:
  # Сценарии мгновенного шока: P&L позиции ≈ −MD × Δy, где Δy = ΔUST + Δспреда (бп).
  # Шок спреда: EM — позиции с Region = EM; HY — рейтинг ниже BBB-; если бумага и EM, и HY —
  # берётся больший из двух шоков (без двойного счёта). Кэш/T-bills — только ΔUST.
  # ±100 бп по UST — стандартный сценарий параллельного сдвига; 100 бп по спредам — порядок
  # расширения HY OAS в умеренный стресс (например, 271 → 340 бп за сентябрь–октябрь 2026 = +69 бп).
  scenarios:
    - {name: "UST +100 бп", ust: 100, em: 0, hy: 0, ig: 0}
    - {name: "UST −100 бп", ust: -100, em: 0, hy: 0, ig: 0}
    - {name: "Спреды EM +100 бп", ust: 0, em: 100, hy: 0, ig: 0}
    - {name: "Спреды HY +100 бп", ust: 0, em: 0, hy: 100, ig: 0}
    - {name: "Комбинированный: UST +100, EM и HY +100", ust: 100, em: 100, hy: 100, ig: 0}

concentration:
  # Максимальная доля одного эмитента. 5% — классический лимит диверсификации
  # (правило UCITS 5/10/40). Гос. бумаги и диверсифицированные фонды не учитываются.
  issuer_max: 0.05
  # Максимальная доля одной страны, кроме «домашнего» рынка (США — базовый рынок портфеля).
  # 10% ограничивает суверенный риск одной EM-страны трётью EM-лимита.
  country_max: 0.10
  home_countries: [USA]
  # Максимальная доля укрупнённого сектора (часть названия сектора до «/»:
  # «Energy / NOC» и «Energy / Midstream» -> «Energy»). 20% — типичный ориентир
  # отраслевой диверсификации кредитного портфеля.
  sector_group_max: 0.20
  # Лимит EM — из дашборда компании («в пределах целевого лимита ~30%»).
  em_total_max: 0.30
  # Лимит HY по умолчанию берётся как сумма целей HY-сегментов листа Allocation
  # (Medium Term HY + HY Funds). Значение ниже — резерв, если листа нет.
  hy_total_max_fallback: 0.155
  # Сигнал «близко к лимиту», когда доля достигает этой части лимита.
  warn_band: 0.9
